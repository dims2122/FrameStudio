<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | FrameStudioCode</title>

    <meta
        name="description"
        content="Buat akun FrameStudioCode."
    >

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="../CSS/main.css"
    >

</head>

<body>

    <!-- NAVBAR -->
    <div id="navbar"></div>


    <!-- REGISTER -->
    <main>

        <section class="auth-section">

            <div class="container">

                <div class="auth-card">

                    <!-- HEADER -->
                    <div class="auth-header">

                        <div class="auth-icon">
                            <i class="fa-solid fa-user-plus"></i>
                        </div>

                        <span class="eyebrow">
                            Create Account
                        </span>

                        <h1>
                            Buat
                            <span>Akun Baru</span>
                        </h1>

                        <p>
                            Daftar untuk membuat akun
                            FrameStudioCode.
                        </p>

                    </div>


                    <!-- FORM -->
                    <form
                        class="auth-form"
                        id="registerForm"
                    >

                        <!-- NAMA -->
                        <div class="form-group">

                            <label for="registerName">
                                Nama Lengkap
                            </label>

                            <input
                                type="text"
                                id="registerName"
                                name="name"
                                placeholder="Masukkan nama lengkap"
                                autocomplete="name"
                                required
                            >

                        </div>


                        <!-- EMAIL -->
                        <div class="form-group">

                            <label for="registerEmail">
                                Email
                            </label>

                            <input
                                type="email"
                                id="registerEmail"
                                name="email"
                                placeholder="nama@email.com"
                                autocomplete="email"
                                required
                            >

                        </div>


                        <!-- PASSWORD -->
                        <div class="form-group">

                            <label for="registerPassword">
                                Password
                            </label>

                            <div class="password-field">

                                <input
                                    type="password"
                                    id="registerPassword"
                                    name="password"
                                    placeholder="Buat password"
                                    autocomplete="new-password"
                                    minlength="8"
                                    required
                                >

                                <button
                                    type="button"
                                    class="password-toggle"
                                    aria-label="Tampilkan password"
                                >
                                    <i class="fa-solid fa-eye"></i>
                                </button>

                            </div>

                        </div>


                        <!-- KONFIRMASI PASSWORD -->
                        <div class="form-group">

                            <label for="confirmPassword">
                                Konfirmasi Password
                            </label>

                            <div class="password-field">

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    name="confirmPassword"
                                    placeholder="Ulangi password"
                                    autocomplete="new-password"
                                    minlength="8"
                                    required
                                >

                                <button
                                    type="button"
                                    class="password-toggle"
                                    aria-label="Tampilkan password"
                                >
                                    <i class="fa-solid fa-eye"></i>
                                </button>

                            </div>

                        </div>


                        <!-- TERMS -->
                        <div class="auth-options">

                            <label class="checkbox-label">

                                <input
                                    type="checkbox"
                                    name="terms"
                                    required
                                >

                                <span>
                                    Saya menyetujui syarat dan
                                    ketentuan yang berlaku.
                                </span>

                            </label>

                        </div>


                        <!-- BUTTON -->
                        <button
                            type="submit"
                            class="btn btn-primary auth-button"
                        >

                            Daftar Sekarang

                            <i class="fa-solid fa-arrow-right"></i>

                        </button>

                    </form>


                    <!-- LOGIN -->
                    <div class="auth-footer">

                        <p>
                            Sudah punya akun?

                            <a href="login.html">
                                Login sekarang
                            </a>
                        </p>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <div id="footer"></div>


    <!-- JAVASCRIPT -->
    <script src="../JS/main.js"></script>

</body>

</html>
